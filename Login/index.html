<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Cadastro</title>
</head>

<body class="min-h-screen flex items-center justify-center bg-stone-100">
    <div class="mx-auto flex-col w-md items-center gap-x-4 rounded-xl bg-white p-6 shadow-lg outline-black/5">
        <h2 class="text-2xl font-bold text-center text-black">Entrar</h2>
        <p class="text-gray-500 font-medium text-center dark:text-gray-400">Acesse sua conta</p>
        <form class="items-center w-sm flex-col text-center">
            <label class=" text-left block text-gray-700 text-sm font-bold mb-2" for="email">E-mail</label>
            <input class="border-1 border-grey-300 rounded w-full p-2 text-gray-700 " type="email"
                placeholder="voce@email.com">
            <label class=" text-left block text-gray-700 text-sm font-bold mb-2" for="email">Senha</label>
            <input class="border-1 border-grey-300 gap-y-3 rounded w-full p-2 text-gray-700 " type="password"
                placeholder="**********">
            <button class="p-2 bg-black w-sm mt-8 mb-5 cursor-pointer text-white rounded">Entrar</button>
            <label class="text-gray-500 font-medium">Não tem conta?</label>
            <button class="font-bold cursor-pointer ">Cadastre-se</button>

        </form>

    </div>
</body>

</html>
